<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060a">
<title>LiveDish AI | 3D &amp; AR Restaurant Technology</title>
<meta name="description" content="Fly through 15 AI and AR products for restaurants: 3D AR menus, ordering, reservations, loyalty, kitchen, inventory, analytics and marketing.">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--o:#ff6a2b;--g:#ffc27a;--w:#faf6ef;--m:#b9b0c4}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#07060a}
body{color:var(--w);font-family:'Manrope',system-ui,sans-serif;overflow-x:hidden;line-height:1.55}
h1,h2,.logo{font-family:'Bricolage Grotesque',sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--g);outline-offset:3px}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;background:radial-gradient(ellipse at 50% 40%,#2a1238,#07060a 70%)}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.22);box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%)}
@supports not (backdrop-filter:blur(1px)){.glass{background:rgba(30,20,40,.88)}}
header{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(1100px,94%);z-index:50;border-radius:60px;padding:9px 10px 9px 22px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:20px;letter-spacing:-.03em}.logo b{color:var(--o)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 20px;border-radius:50px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);font-weight:700;font-size:14px;transition:transform .3s}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.btn.pri{background:linear-gradient(110deg,#ff9150,var(--o));color:#1a0c05;border:0;box-shadow:0 10px 30px rgba(255,106,43,.4)}
.nl{display:flex;gap:22px;align-items:center;font-size:14px}.nl a:not(.btn){color:#e0d8ea}.nl a:not(.btn):hover{color:var(--g)}
.dots{position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:9px}
.dots button{width:9px;height:9px;border-radius:50%;border:1px solid rgba(255,255,255,.6);background:none;padding:0;transition:.3s}
.dots button.on{background:var(--o);border-color:var(--o);box-shadow:0 0 12px var(--o);transform:scale(1.5)}
.depth{position:fixed;left:20px;bottom:18px;z-index:50;padding:8px 16px;border-radius:30px;font-size:12px;color:var(--g)}
main{position:relative;z-index:2}
.s{height:100svh;min-height:600px;display:flex;align-items:center;padding:90px 6vw 50px}
.s.r{justify-content:flex-end}
.card{width:min(500px,100%);border-radius:28px;padding:clamp(22px,3.4vw,36px);transform:translateY(40px) scale(.95);opacity:0;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s}
.s.in .card{transform:none;opacity:1}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--g);padding:6px 14px;border-radius:30px;background:rgba(255,106,43,.14);border:1px solid rgba(255,140,70,.35)}
.tag:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--o);box-shadow:0 0 12px var(--o)}
.pick{margin-left:8px;font-size:11px;background:var(--o);color:#1a0c05;padding:3px 10px;border-radius:20px;font-weight:800}
.card h2{font-size:clamp(30px,4.2vw,50px);line-height:1;letter-spacing:-.04em;margin:14px 0 6px}
.grad{background:linear-gradient(100deg,#fff,var(--g) 45%,var(--o));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-weight:700;color:var(--g);font-size:15px}
.tl{color:#e2d9ec;font-size:15px;margin-top:6px}
.card ul{list-style:none;margin:16px 0 4px}
.card li{font-size:14px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.1);color:#ece5f4}
.card li:before{content:"✦ ";color:var(--o)}
.rev{margin-top:12px;font-size:13px;color:var(--g)}
.hero{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
form label{display:block;font-size:12px;color:var(--m);margin:12px 0 5px}
form input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:var(--w);font:16px 'Manrope';outline:none}
form input:focus{border-color:var(--o)}form .btn{width:100%;margin-top:16px}
@media(max-width:800px){
 .nl a:not(.btn),.dots,.depth{display:none}
 header{padding:7px 8px 7px 18px}.btn{padding:9px 16px;font-size:13px}
 /* no glass on mobile: keep the 3D scene fully visible, text sits on a soft fade */
 .s,.s.r{align-items:flex-end;justify-content:center;padding:0;min-height:0}
 .card.glass{width:100%;border:0;border-radius:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;background:linear-gradient(rgba(7,6,10,0),rgba(7,6,10,.82) 38%);padding:64px 16px calc(14px + env(safe-area-inset-bottom))}
 .tag{font-size:11px;padding:4px 10px}.card h2{font-size:27px;margin:8px 0 2px}.sub{font-size:13px}.tl{font-size:13px;margin-top:4px}
 .card ul{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
 .card li{font-size:11px;padding:4px 10px;border:1px solid rgba(255,255,255,.22);border-radius:20px;background:rgba(0,0,0,.45)}
 .card li:before{content:""}
 .rev{font-size:11px;margin-top:8px}
 .card h2,.sub,.tl,.rev,.tag{text-shadow:0 2px 12px #000}
 form label{margin:8px 0 3px}form input{padding:10px 12px}
}
@media(prefers-reduced-motion:reduce){.card{transition:none;opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<header class="glass"><a href="#s0" class="logo">LiveDish<b>AI</b></a>
 <nav class="nl"><a href="#s0">Customer apps</a><a href="#s5">Management</a><a href="#s10">Advanced AI</a><a href="#s15" class="btn pri">Book demo</a></nav></header>
<nav class="dots" id="dots" aria-label="Sections"></nav>
<div class="depth glass" id="depth">DEPTH 00%</div>
<main id="main"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
/* ===== SETTINGS: change these to match your hosting ===== */
const MODEL_PATH='3d-model/';   /* folder that holds Cheesy-Green-Lasagne/, Fried-Calamari/ ... */
const GROUPS=['Customer apps','Restaurant management','Advanced AI'];
const ACC=['#ff6a2b','#8b5cff','#2dd4bf'];

/* name, subtitle, icon, tagline, features|…, revenue, 3D model folder, tech tag */
const P=[
['LiveDish AI','3D & AR Restaurant Menu','🍽️','Customers scan a QR code and see realistic 3D dishes before ordering.','3D food models and AR placement|Dish images, ingredients and prices|Multi-language menu|WhatsApp ordering|Dietary and allergen information','Monthly subscription per restaurant.','Cheesy-Green-Lasagne','3D · WEBAR · AI'],
['Smart Ordering App','Your restaurant’s own online ordering system','🛒','A restaurant’s own online ordering system.','Digital menu and shopping cart|Table, takeaway and delivery orders|Online payment|Order tracking|Discount codes and offers','Monthly subscription plus optional transaction fee.','Fried-Calamari','AR MENU · AI'],
['TableBook AI','Table Reservation','📅','','Live table availability|Advance booking|Party-size selection|Booking deposits|Automated confirmation and reminders','Monthly subscription or booking fee.','','AI · AR TABLE VIEW'],
['Foodie Rewards','Loyalty App','🎁','','Digital membership cards|Earn points on every purchase|Redeem rewards|Birthday offers|Referral rewards','Monthly subscription per restaurant.','','AI · AR REWARDS'],
['FoodMate AI','Personal Food Assistant','🤖','','AI-based dish recommendations|Vegetarian and vegan filters|Spice-level preferences|Budget-based recommendations|Ingredient and allergen information','SaaS subscription.','Pinocchio-Tiramisu','AI · AR PREVIEW'],
['KitchenFlow','Kitchen Display System','👨‍🍳','','Live incoming orders|Kitchen order queue|Preparation timers|Ready-to-serve notifications|Kitchen performance dashboard','','','AI TIMING · AR ORDERS'],
['StockChef AI','Inventory Management','📦','','Ingredient stock management|Expiry date alerts|Automatic low-stock warnings|Supplier management|Purchase order generation|Food wastage tracking','','','AI FORECAST · AR'],
['RestaurantIQ','Business Analytics','📊','','Daily and monthly revenue|Best-selling dishes|Peak-hour analytics|Customer spending patterns|Profit and expense reports','','','AI INSIGHTS · AR DATA'],
['StaffMate','Employee Management','👥','','Staff attendance|Shift scheduling|Leave management|Payroll records|Staff performance','','','AI ROSTER · AR'],
['MenuCost AI','Food Cost Calculator','🧮','','Ingredient-wise costing|Recipe management|Selling price calculator|Gross margin calculation|Food cost percentage|Menu profitability analysis','','','AI COSTING · AR MENU'],
['FoodStudio AI','Food Photography','📸','','Convert food photos into promotional creatives|AI food background generation|Instagram post creation|Festival offer posters|Menu photography enhancement','','Pistachio-Sauce-Bigne-with-Ricotta','GEN-AI · 3D · AR'],
['WaiterBot AI','Virtual Restaurant Assistant','💬','','Answer menu questions|Explain dishes|Recommend combinations|Accept customer requests|Handle reservation enquiries','','','AI CHAT · AR DISHES'],
['ReviewBoost AI','Customer Feedback','⭐','','QR-based feedback|Customer satisfaction ratings|AI sentiment analysis|Complaint management|Feedback reports','','','AI SENTIMENT · AR'],
['RestaurantMarketing AI','Campaigns & Promotions','🚀','','Social media content generator|Daily promotional campaigns|Automated offer creation|WhatsApp campaign management|Customer segmentation','','','GEN-AI · AR PROMOS'],
['RestaurantOS','All-in-One Management','🌐','','Multiple branch management|Central menu management|Orders and reservations|Staff and inventory|Revenue analytics|Owner dashboard','','','AI + AR PLATFORM']
];
const N=P.length+1,GAP=15;
const fine=matchMedia('(hover:hover) and (pointer:fine)').matches,still=matchMedia('(prefers-reduced-motion:reduce)').matches;
const small=()=>innerWidth<800;

/* ---- build sections ---- */
document.getElementById('main').innerHTML=P.map((p,i)=>`<section class="s${i%2?' r':''}" id="s${i}"><div class="card glass">
<span class="tag">${GROUPS[i/5|0]}</span>${i?'':'<span class="pick">My top pick</span>'}
<h2 class="grad">${p[0]}</h2><div class="sub">${p[1]}</div>${p[3]?`<p class="tl">${p[3]}</p>`:''}
<ul>${p[4].split('|').map(f=>`<li>${f}</li>`).join('')}</ul>${p[5]?`<p class="rev">Revenue: ${p[5]}</p>`:''}</div></section>`).join('')+
`<section class="s r" id="s15"><div class="card glass"><span class="tag">AI + AR for your restaurant</span><h2 class="grad">Book your demo</h2>
<p class="tl">See your own dishes as 3D and AR models, with AI ordering and insights.</p>
<form id="form"><label for="n">Your name</label><input id="n" name="name" required autocomplete="name"><label for="e">Email</label><input id="e" name="email" type="email" required autocomplete="email"><label for="r">Restaurant</label><input id="r" name="restaurant" required>
<button class="btn pri" type="submit">Request a demo</button></form></div></section>`;
const dots=document.getElementById('dots');
for(let i=0;i<N;i++){const b=document.createElement('button');b.setAttribute('aria-label','Section '+(i+1));b.onclick=()=>document.getElementById('s'+i).scrollIntoView({behavior:'smooth'});dots.appendChild(b)}
new IntersectionObserver(es=>es.forEach(e=>{e.target.classList.toggle('in',e.isIntersecting);
 if(e.isIntersecting){const i=+e.target.id.slice(1);[...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i))}}),{threshold:.35}).observe&&0;
const io=new IntersectionObserver(es=>es.forEach(e=>{e.target.classList.toggle('in',e.isIntersecting);
 if(e.isIntersecting){const i=+e.target.id.slice(1);[...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i))}}),{threshold:.35});
document.querySelectorAll('.s').forEach(s=>io.observe(s));
document.getElementById('form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
 location.href='mailto:hello@livedish.ai?subject='+encodeURIComponent('LiveDish AI Demo Request')+'&body='+encodeURIComponent(`Name: ${d.name}\nEmail: ${d.email}\nRestaurant: ${d.restaurant}`)};

/* ---- three.js ---- */
const R=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputEncoding=THREE.sRGBEncoding;
const S=new THREE.Scene();S.fog=new THREE.FogExp2(0x07060a,.016);
S.add(new THREE.HemisphereLight(0xffffff,0x553322,1.3));const dl=new THREE.DirectionalLight(0xffe6c8,1.6);dl.position.set(3,5,6);S.add(dl);
const C=new THREE.PerspectiveCamera(55,1,.1,300),TL=new THREE.TextureLoader();TL.setCrossOrigin('anonymous');
const rr=(x,a,b,w,h,r)=>{x.beginPath();x.roundRect?x.roundRect(a,b,w,h,r):x.rect(a,b,w,h)};
const tex=k=>new THREE.CanvasTexture(k);

/* generated illustration of each product's app screen (replace with real screenshots later) */
function mock(p,i){const k=document.createElement('canvas');k.width=400;k.height=520;const x=k.getContext('2d'),ac=ACC[i/5|0];
 x.fillStyle='rgba(18,12,26,.93)';rr(x,4,4,392,512,36);x.fill();x.strokeStyle='rgba(255,255,255,.45)';x.lineWidth=3;x.stroke();
 x.fillStyle=ac;rr(x,24,24,352,92,24);x.fill();
 x.fillStyle='#fff';x.font='44px sans-serif';x.fillText(p[2],38,84);x.font='800 21px sans-serif';x.fillText(p[0].slice(0,22),100,64);x.font='600 14px sans-serif';x.fillText(p[7],100,92);
 p[4].split('|').slice(0,4).forEach((f,j)=>{const y=140+j*56;x.fillStyle='rgba(255,255,255,.1)';rr(x,24,y,352,44,16);x.fill();x.fillStyle=ac;x.beginPath();x.arc(46,y+22,7,0,7);x.fill();x.fillStyle='#f3ecf9';x.font='600 16px sans-serif';x.fillText(f.slice(0,31),64,y+28)});
 for(let j=0;j<9;j++){const h=18+((i*37+j*53)%72);x.fillStyle=j%3?ac:'#ffc27a';rr(x,32+j*38,500-h,24,h,6);x.fill()}
 return new THREE.Mesh(new THREE.PlaneGeometry(3.1,4.03),new THREE.MeshBasicMaterial({map:tex(k),transparent:true,side:THREE.DoubleSide}))}
function label(tag,title,sub,w=4.2){const k=document.createElement('canvas');k.width=640;k.height=230;const x=k.getContext('2d');
 const g=x.createLinearGradient(0,0,640,230);g.addColorStop(0,'rgba(255,255,255,.28)');g.addColorStop(1,'rgba(255,255,255,.07)');
 x.fillStyle=g;x.strokeStyle='rgba(255,255,255,.5)';x.lineWidth=3;rr(x,6,6,628,218,34);x.fill();x.stroke();
 x.fillStyle='#ff8a4b';x.font='700 26px sans-serif';x.fillText(tag,34,58);x.fillStyle='#fff';x.font='800 38px sans-serif';x.fillText(title.slice(0,24),34,114);
 x.fillStyle='#d9cfe6';x.font='500 25px sans-serif';x.fillText(sub,34,166);x.fillStyle='#ff6a2b';x.beginPath();x.arc(598,40,9,0,7);x.fill();
 return new THREE.Mesh(new THREE.PlaneGeometry(w,w*230/640),new THREE.MeshBasicMaterial({map:tex(k),transparent:true,depthWrite:false}))}
function brackets(s){const g=new THREE.Group(),mt=new THREE.MeshBasicMaterial({color:0xffc27a});
 [[-1,1],[1,1],[-1,-1],[1,-1]].forEach(([a,b])=>{const h=new THREE.Mesh(new THREE.BoxGeometry(s*.3,.05,.05),mt),v=new THREE.Mesh(new THREE.BoxGeometry(.05,s*.3,.05),mt);
  h.position.set(a*(s-s*.15),b*s*1.3,0);v.position.set(a*s,b*(s*1.3-s*.15),0);g.add(h,v)});return g}

/* load .glb (falls back to the .png photo as a round plate) */
const spinners=[];
function loadModel(n,host){const base=MODEL_PATH+n+'/'+n,w=new THREE.Group();host.add(w);spinners.push(w);
 const fallback=()=>{const m=new THREE.Mesh(new THREE.CircleGeometry(1.2,48),new THREE.MeshBasicMaterial({color:0x6b3a22,side:THREE.DoubleSide}));
  TL.load(base+'.png',t=>{m.material.map=t;m.material.color.set(0xffffff);m.material.needsUpdate=true});w.add(m)};
 if(!THREE.GLTFLoader)return fallback();
 new THREE.GLTFLoader().load(base+'.glb',gl=>{const o=gl.scene,b=new THREE.Box3().setFromObject(o),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),k=2.6/Math.max(s.x,s.y,s.z);
  o.scale.setScalar(k);o.position.sub(c.multiplyScalar(k));w.add(o)},undefined,fallback);return w}

const stations=[];
P.forEach((p,i)=>{
 const g=new THREE.Group(),m=mock(p,i);g.add(m,brackets(1.7));
 if(p[6]){m.position.set(0,.5,-1.2);m.scale.setScalar(.85);const w=loadModel(p[6],g);w.position.set(0,-.5,1.1)}
 const lb=label(p[7],p[0],GROUPS[i/5|0]);lb.position.set(0,-3,.3);g.add(lb);
 g.userData={i};S.add(g);stations.push(g)});
/* final station: AI + AR knot */
{const g=new THREE.Group(),k=new THREE.Mesh(new THREE.TorusKnotGeometry(1.3,.38,160,20),new THREE.MeshBasicMaterial({color:0xff6a2b,wireframe:true}));
 const lb=label('AI + AR','LiveDish AI','Book a demo');lb.position.set(0,-2.8,.3);g.add(k,lb);g.userData={i:15,knot:k};S.add(g);stations.push(g)}
function place(){const sm=small();stations.forEach(g=>{const i=g.userData.i;g.position.set(sm?0:(i%2===0?3.2:-3.2),sm?1.35:0,-i*GAP);g.scale.setScalar(sm?.72:1)})}
place();

/* floating AR / AI chips + dust */
const chipT=['AR','AI','3D','WebAR','GenAI'].map(t=>{const k=document.createElement('canvas');k.width=256;k.height=110;const x=k.getContext('2d');
 x.fillStyle='rgba(255,255,255,.2)';x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=3;rr(x,4,4,248,102,40);x.fill();x.stroke();
 x.fillStyle='#ffc27a';x.font='800 52px sans-serif';x.textAlign='center';x.fillText(t,128,74);return tex(k)});
const chips=[];for(let i=0;i<(small()?16:34);i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(1.1,.47),new THREE.MeshBasicMaterial({map:chipT[i%5],transparent:true,depthWrite:false,side:THREE.DoubleSide}));
 const a=Math.random()*6.28,r=4+Math.random()*6;m.position.set(Math.cos(a)*r,Math.sin(a)*r*.6,-Math.random()*(N-1)*GAP-4);m.userData={s:Math.random()*6,y:m.position.y};S.add(m);chips.push(m)}
const n=600,pa=new Float32Array(n*3);for(let i=0;i<n;i++){pa[i*3]=(Math.random()-.5)*40;pa[i*3+1]=(Math.random()-.5)*26;pa[i*3+2]=-Math.random()*(N*GAP)+10}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pa,3));
S.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0xffb27a,size:.07,transparent:true,opacity:.75})));

function size(){R.setSize(innerWidth,innerHeight,false);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();place()}
size();addEventListener('resize',size);
let mx=0,my=0,tx=0,ty=0,cz=7,T=0;
addEventListener('pointermove',e=>{if(fine){tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5}});
const dep=document.getElementById('depth');
(function loop(){requestAnimationFrame(loop);T+=.016;
 const u=scrollY/innerHeight,target=7-u*GAP,v=target-cz;cz+=v*(still?1:.07);
 C.fov=(small()?62:55)+Math.min(Math.abs(v)*2,22);C.updateProjectionMatrix();   /* zoom-warp on fast scroll */
 mx+=(tx-mx)*.05;my+=(ty-my)*.05;
 C.position.set(mx*1.6+Math.sin(T*.4)*.15,-my+Math.cos(T*.3)*.1,cz);C.lookAt(mx*.8,-my*.5,cz-10);C.rotation.z=v*.004;
 stations.forEach(g=>{const i=g.userData.i;if(g.userData.knot){g.userData.knot.rotation.x=T*.4;g.userData.knot.rotation.y=T*.6}else{g.children[0].rotation.y=Math.sin(T*.8+i)*.3;g.children[0].position.y+=(Math.sin(T+i)*.15+(P[i][6]?.5:0)-g.children[0].position.y)*.1}});
 spinners.forEach(w=>w.rotation.y=T*.7);
 chips.forEach(c=>{c.position.y=c.userData.y+Math.sin(T+c.userData.s)*.3;c.lookAt(C.position)});
 R.render(S,C);dep.textContent='DEPTH '+String(Math.min(100,Math.round(u/(N-1)*100))).padStart(2,'0')+'%'})();
</script>
</body>
</html>
